<!doctype html>

<style>
:root{--bg:#f4f4f5;--card:#fff;--ink:#18181b;--muted:#71717a;--line:#e4e4e7;--flag:#d97706}
*{box-sizing:border-box} body{margin:0;padding:24px 16px;background:var(--bg);color:var(--ink);font:14px/1.4 system-ui,-apple-system,Segoe UI,sans-serif}
h1{font-size:20px;margin:0 0 4px} p{margin:0 0 20px;color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px;max-width:1200px}
figure{margin:0;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px}
figure.flag{border-color:var(--flag);box-shadow:inset 0 0 0 1px var(--flag)}
.pair{display:flex;gap:6px} .t{flex:1;height:84px;display:flex;align-items:center;justify-content:center;border-radius:6px}
.w{background:#fff;border:1px solid var(--line)} .k{background:#1f2937}
.t img{width:64px;height:64px;object-fit:contain} .miss{color:#a1a1aa;font-size:12px}
figcaption{margin-top:8px;display:flex;flex-direction:column} figcaption span{color:var(--muted);font-size:12px;word-break:break-all}
</style></head><body>
