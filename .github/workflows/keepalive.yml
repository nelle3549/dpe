# Keeps the free Supabase project from being paused for inactivity (7 days of low use),
# so participant data stays available for the full retention year.
# Once a month it also commits a timestamp, because GitHub turns off scheduled
# workflows in repos with no activity for 60 days.
name: keepalive
on:
  schedule:
    - cron: '17 1 * * *'      # every day, 09:17 Manila time
  workflow_dispatch:
permissions:
  contents: write
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Query the database
        run: |
          URL=$(grep -o "supabaseUrl: '[^']*'" app/config.js | cut -d"'" -f2)
          KEY=$(grep -o "supabaseAnonKey: '[^']*'" app/config.js | cut -d"'" -f2)
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST "$URL/rest/v1/rpc/check_join_code" \
            -H "apikey: $KEY" -H "Authorization: Bearer $KEY" -H 'Content-Type: application/json' -d '{"p_code":"keepalive"}')
          echo "Supabase answered $code"
          test "$code" = 200
      - name: Monthly commit so the schedule stays on
        if: github.event_name == 'schedule'
        run: |
          if [ "$(date -u +%d)" = "01" ]; then
            date -u +%FT%TZ > .github/last-keepalive
            git config user.name 'keepalive bot'
            git config user.email 'actions@users.noreply.github.com'
            git add .github/last-keepalive
            git commit -m 'keepalive' && git push
          fi
